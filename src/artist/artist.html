<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Artist</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; scrollbar-width: none; -ms-overflow-style: none; }
        ::-webkit-scrollbar { width: 0; height: 0; display: none; }
        :root {
            --bg: #181a1b; --titlebar: #121415; --input: #121415; --bar: #1b1e1f;
            --panel: #161819; --card: #202325; --hover-bg: #24282a;
            --line: #2a2e30; --line-2: #1e2224; --scroll: #3a3f42;
            --text: #e8e6e3; --text-2: #cfcac2; --muted: #9a968e; --sub: #848079;
            --accent: #1da0c3; --hover-text: #ffffff;
        }
        html, body { height: 100%; }
        body {
            background: var(--bg); color: var(--text); overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Roboto, sans-serif;
            display: flex; flex-direction: column; user-select: none;
            /* overlay transition: the view fades in when it opens (the page
               behind shows through until it's done) */
            animation: overlay-in .26s ease-out;
        }
        @keyframes overlay-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        .scroll { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }
        .hero {
            position: relative; padding: 34px 26px 22px;
            display: flex; gap: 22px; align-items: flex-end;
            /* same treatment as the album page: the bg bleeds -40px on each
               side for the blur; clip horizontally only so the vertical bleed
               into the discography stays */
            overflow-x: clip;
        }
        .hero-info, .hero-photo { z-index: 1; }
        .hero-bg {
            position: absolute; left: -40px; top: -60px; right: -40px; bottom: -80px;
            background-size: cover; background-position: center;
            filter: blur(26px) brightness(.55) saturate(1.15);
            transform: scale(1.25); pointer-events: none;
        }
        .hero-bg.fade {
            -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 28%, transparent 100%);
            mask-image: linear-gradient(to bottom, #000 0%, #000 28%, transparent 100%);
        }
        .hero-photo {
            width: 230px; height: 230px; border-radius: 12px; object-fit: cover;
            border: 1px solid rgba(255,255,255,.12); position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,.45); flex-shrink: 0;
            background: var(--line);
        }
        .hero-info { position: relative; min-width: 0; padding-bottom: 2px; }
        .hero-name { font-size: 1.875rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; text-shadow: 0 2px 12px rgba(0,0,0,.5); }
        .hero-meta { font-size: 0.75rem; color: var(--muted); margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .hero-meta .dot { color: var(--sub); }
        .hero-meta a { color: var(--muted); text-decoration: none; }
        .hero-meta a:hover { color: var(--accent); text-decoration: underline; }
        .hero-btns { display: flex; align-items: center; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
        /* round icon buttons, same as the album page */
        .hbtn {
            display: inline-flex; align-items: center; justify-content: center;
            width: 44px; height: 44px; padding: 0; border-radius: 50%;
            border: 1px solid transparent; background: var(--hover-bg);
            color: var(--text); cursor: pointer; font-family: inherit;
        }
        .hbtn:hover { border-color: var(--accent); }
        .hbtn.primary { background: #fff; color: #000; width: 56px; height: 56px; }
        .hbtn.primary:hover { border-color: var(--accent); filter: brightness(.94); }
        .hbtn:active { transform: scale(.96); transition: transform .08s ease; }
        .hbtn svg { width: 16px; height: 16px; display: block; }
        .hbtn.primary svg { width: 22px; height: 22px; }
        .hbtn.following { color: var(--accent); border-color: var(--accent); }
        .hbtn.following:hover { color: var(--text); border-color: var(--line); }
        .bio { font-size: 0.8125rem; color: var(--muted); line-height: 1.55; max-width: 860px; margin-top: 8px; text-shadow: 0 1px 8px rgba(0,0,0,.4); }
        .section { position: relative; z-index: 1; padding: 18px 26px 6px; }
        .section h2 {
            font-size: 0.875rem; font-weight: 700; letter-spacing: .02em; margin-bottom: 14px;
            display: flex; align-items: baseline; gap: 10px;
        }
        .section h2 .cnt { font-size: 0.6875rem; color: var(--sub); font-weight: 500; }
        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px;
            align-content: start; padding-bottom: 10px;
        }
        .card { cursor: pointer; transition: filter .18s ease; }
        /* spotlight: right-clicking a card dims every other card (art + text)
           while the menu is open; the target card keeps full brightness */
        .dim .card { filter: brightness(.3) saturate(.5); }
        .dim .card.spot { filter: none; }
        .dim .card.spot .artwrap { box-shadow: 0 0 0 2px var(--accent); }
        .card .art {
            width: 100%; aspect-ratio: 1 / 1; border-radius: 6px; background: var(--line);
            object-fit: cover; display: block;
opacity: 0; transition: opacity .4s ease, filter .25s ease;
            box-shadow: 0 0 0 0 transparent;
        }
        .card .art.in { opacity: 1; }
        .card .art.nophoto { opacity: 1; }
        .card:hover .artwrap { transform: scale(1.03); box-shadow: 0 0 0 2px var(--accent); }
        .card:active .artwrap { transform: scale(.98); }
        /* album page loading: the clicked card's cover blurs (spill clipped by
           the artwrap) with a centered spinner, same as the collection/search view */
        .card.loading { pointer-events: none; }
        .card.loading .art { transform: none; filter: blur(14px) brightness(.6); box-shadow: none; }
        .card-spin { position: absolute; left: 50%; top: 50%; width: 42px; height: 42px; transform: translate(-50%, -50%); z-index: 3; pointer-events: none; }
        .artwrap { position: relative; border-radius: 6px; overflow: hidden; transition: transform .12s ease, box-shadow .12s ease; }
        .card .t { font-size: 0.75rem; margin-top: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card .a { font-size: 0.6875rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
        .card .y { font-size: 0.625rem; color: var(--sub); margin-top: 1px; }
        .state { padding: 40px 26px; color: var(--muted); font-size: 0.8125rem; }

        /* inline tracklist panel: same treatment as the collection's */
        .tlinline {
            position: relative;
            grid-column: 1 / -1; display: flex; gap: 24px; align-items: flex-start;
            background: color-mix(in srgb, var(--bar) 86%, transparent);
            backdrop-filter: blur(6px);
            border: 1px solid var(--line); border-radius: 10px;
            padding: 20px; margin: 4px 0; height: max-content;
            animation: tlslide .18s ease;
        }
        @keyframes tlslide { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
        .tlbg {
            position: absolute; left: 0; top: 0; bottom: 0; width: 40%;
            border-radius: 9px; overflow: hidden; pointer-events: none;
            -webkit-mask-image: linear-gradient(to right, #000 0%, #000 45%, transparent 100%);
            mask-image: linear-gradient(to right, #000 0%, #000 45%, transparent 100%);
        }
        .tlbg-img {
            width: 100%; height: 100%; object-fit: cover;
            filter: blur(18px) brightness(.5);
            transform: scale(1.4);
        }
        .tlleft { width: 180px; flex-shrink: 0; position: sticky; top: 20px; }
        .tlart { width: 100%; aspect-ratio: 1/1; border-radius: 6px; object-fit: cover; background: var(--line); display: block; }
        .tltitle { font-size: 0.875rem; font-weight: 600; margin-top: 12px; line-height: 1.3; }
        .tlartist { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
        .tlyear { font-size: 0.6875rem; color: var(--sub); margin-top: 2px; }
        .tlbtns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
        .tlbtns button {
            background: var(--hover-bg); border: 1px solid var(--line); color: var(--text);
            border-radius: 6px; padding: 6px 12px; font-size: 0.6875rem; cursor: pointer; font-family: inherit;
            flex: 1; text-align: center;
        }
        .tlbtns .tlplayall { background: var(--accent); border-color: var(--accent); color: #fff; flex: 100%; }
        .tlbtns button:hover { filter: brightness(1.12); }
        .tlright {
            position: relative; flex: 1; display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 4px 24px; align-content: start;
        }
        .tlstate { color: var(--muted); font-size: 0.8125rem; padding: 8px 0; grid-column: 1 / -1; }
        .tlrow {
            display: flex; align-items: center; gap: 10px; padding: 6px 8px; cursor: pointer;
            font-size: 0.8125rem; border-radius: 5px; height: 32px;
        }
        .tlrow:hover { background: rgba(255,255,255,.06); }
        .tlnum { width: 20px; text-align: right; color: var(--sub); font-size: 0.75rem; flex-shrink: 0; }
        .tltrk { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tldur { color: var(--sub); font-size: 0.75rem; flex-shrink: 0; }
        /* per-track context menu (right-click a track row) */
        .cmenu {
            position: fixed; z-index: 999; min-width: 210px; padding: 4px;
            background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
            box-shadow: 0 10px 28px rgba(0,0,0,.4);
            opacity: 0; transform: scale(.96) translateY(-3px);
            transition: opacity .12s ease, transform .12s ease;
            pointer-events: none;
        }
        .cmenu.show { opacity: 1; transform: none; pointer-events: auto; }
        .cmi {
            display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 10px;
            font-size: 0.75rem; color: var(--text); background: none; border: none;
            border-radius: 6px; cursor: pointer; font-family: inherit; text-align: left;
        }
        .cmi:hover { background: var(--hover-bg); color: var(--hover-text); }
        .cmi svg { width: 15px; height: 15px; flex-shrink: 0; }
        /* compact track info above the menu items */
        .cmhead { display: flex; align-items: center; gap: 9px; padding: 6px 8px 7px; }
        .cmart { width: 38px; height: 38px; border-radius: 5px; object-fit: cover; flex-shrink: 0; }
        .cmmeta { min-width: 0; flex: 1; }
        .cmtitle { font-size: 0.75rem; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cmsub { font-size: 0.6875rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        /* fullscreen cover overlay */
        .fsback {
            position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,.88);
            display: flex; align-items: center; justify-content: center; cursor: zoom-out;
            animation: fsback-in .15s ease;
        }
        @keyframes fsback-in { from { opacity: 0; } to { opacity: 1; } }
        .fsimg {
            max-width: 92vw; max-height: 92vh; border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,.6); animation: fsimg-in .18s ease;
        }
        @keyframes fsimg-in { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
        .err { padding: 40px 26px; color: var(--muted); font-size: 0.8125rem; }
    </style>
</head>
<body>
    <div class="scroll" id="scroll">
        <div class="hero" id="hero">
            <div class="hero-bg fade" id="hero-bg"></div>
            <img class="hero-photo" id="hero-photo" alt="">
            <div class="hero-info">
                <div class="hero-name" id="hero-name"></div>
                <div class="bio" id="bio"></div>
                <div class="hero-meta" id="hero-meta"></div>
                <div class="hero-btns">
                    <button class="hbtn primary" id="playall" title="Play discography">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14z"/></svg>
                    </button>
                    <button class="hbtn" id="follow" title="Follow">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 21a8 8 0 0 1 13.292-6"/><circle cx="10" cy="8" r="5"/><path d="m16 19 2 2 4-4"/></svg>
                    </button>
                    <button class="hbtn" id="dlall" title="Download discography">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>
                    </button>
                </div>
            </div>
        </div>
        <div class="section" id="sec-albums">
            <h2>Albums <span class="cnt" id="albums-cnt"></span></h2>
            <div class="grid" id="albums"></div>
        </div>
        <div class="section" id="sec-singles">
            <h2>Singles &amp; EPs <span class="cnt" id="singles-cnt"></span></h2>
            <div class="grid" id="singles"></div>
        </div>
        <div class="err" id="err" style="display:none"></div>
    </div>
    <script>
        const { ipcRenderer } = require('electron');
        const ICONS = { plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>' };
        const MENU_ICON = 'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
        // icons read from the shared set (assets/icons) so they can be edited
        // in one place; sized down + recolored for menu use
        const readIcon = (name) => {
            try {
                const fs = require('fs');
                const path = require('path');
                return fs.readFileSync(path.join(__dirname, '..', '..', 'assets', 'icons', name), 'utf8')
                    .replace(/width="24"/, 'width="15"')
                    .replace(/height="24"/, 'height="15"')
                    .replace(/stroke="#ffffff"/, 'stroke="currentColor"');
            } catch (e) { return ''; }
        };
        const ICON_OPEN = readIcon('open_album.svg');
        const ICON_ART = readIcon('cover_art_fs.svg');
        // the follow button's icons (user-supplied): check = not following,
        // plus = following. readIcon recolors them to the button's color.
        const ICON_FOLLOW = readIcon('follow.svg');
        const ICON_FOLLOWED = readIcon('followed.svg');
        const ICON_Q = `<svg viewBox="0 0 24 24" fill="none" ${MENU_ICON}><path d="M5 12h14"/><path d="M12 5v14"/></svg>`;
        const ICON_DL = `<svg viewBox="0 0 24 24" fill="none" ${MENU_ICON}><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>`;
        const ICON_SEARCH = `<svg viewBox="0 0 24 24" fill="none" ${MENU_ICON}><circle cx="10" cy="8" r="5"/><path d="M2 21a8 8 0 0 1 10.434-7.62"/><circle cx="18" cy="18" r="3"/><path d="m22 22-1.9-1.9"/></svg>`;
        let ctxMenu = null;
        // shared context menu: compact info header + items; used for track rows
        // and album cards
        function showMenu(x, y, info, items) {
            closeTrackMenu();
            const m = document.createElement('div');
            m.className = 'cmenu';
            const head = (info.art || info.title)
                ? `<div class="cmhead">` +
                  (info.art ? `<img class="cmart" src="${info.art.replace(/"/g, '&quot;')}" alt="">` : '') +
                  `<div class="cmmeta">` +
                  `<div class="cmtitle">${escapeHtml(info.title || '')}</div>` +
                  (info.artist ? `<div class="cmsub">${escapeHtml(info.artist)}</div>` : '') +
                  (info.year ? `<div class="cmsub">${escapeHtml(String(info.year))}</div>` : '') +
                  `</div></div>`
                : '';
            m.innerHTML = head + items.map((it) => `<button class="cmi" data-a="${it.a}">${it.icon}${escapeHtml(it.label)}</button>`).join('');
            document.body.appendChild(m);
            const r = m.getBoundingClientRect();
            m.style.left = Math.max(8, Math.min(x, window.innerWidth - r.width - 8)) + 'px';
            m.style.top = Math.max(8, Math.min(y, window.innerHeight - r.height - 8)) + 'px';
            m.addEventListener('click', (e) => {
                const b = e.target.closest('.cmi');
                if (!b) return;
                closeTrackMenu();
                const it = items.find((z) => z.a === b.dataset.a);
                if (it && it.onClick) it.onClick();
            });
            // enter: added hidden, shown on the next frames so the transition runs
            requestAnimationFrame(() => requestAnimationFrame(() => m.classList.add('show')));
            ctxMenu = m;
        }
        // per-track context menu (right-click a track row): add to queue / download
        function openTrackMenu(x, y, info, actions) {
            showMenu(x, y, info, [
                { a: 'queue', icon: ICON_Q, label: 'Add song to queue', onClick: () => actions.queue() },
                { a: 'dl', icon: ICON_DL, label: 'Download track', onClick: () => actions.download() },
                { a: 'search', icon: ICON_SEARCH, label: 'Search ' + (info.artist || ''), onClick: () => {
                    const artist = (info.artist || '').trim();
                    if (artist) ipcRenderer.send('search:run', { text: artist, mode: 'all' });
                } },
            ]);
        }
        // per-album context menu (right-click an album card): open / download /
        // queue / cover art / search the release artist
        function openAlbumMenu(x, y, row, card) {
            const artist = (row.artist || data.name || '').trim();
            showMenu(x, y, { art: row.art, title: row.title, artist, year: row.year || '' }, [
                { a: 'open', icon: ICON_OPEN, label: 'Open album', onClick: () => ipcRenderer.send('album:open', { url: row.url, artUrl: row.art, title: row.title }) },
                { a: 'dl', icon: ICON_DL, label: 'Download album', onClick: () => { void openFormatsMenu(x, y, row, card); } },
                { a: 'queue', icon: ICON_Q, label: 'Add album to queue', onClick: () => { void ipcRenderer.invoke('collection:enqueue', { tralbumId: row.tralbumId, tralbumType: 'a', bandId: row.bandId || data.bandId }); } },
                { a: 'fs', icon: ICON_ART, label: 'View cover art', onClick: () => showArtFullscreen(row.art) },
                { a: 'search', icon: ICON_SEARCH, label: 'Search ' + artist, onClick: () => { if (artist) ipcRenderer.send('search:run', { text: artist, mode: 'all' }); } },
            ]);
            spotlightCard(card);
        }
        // format picker for "download album": same flow as the collection's
        async function openFormatsMenu(x, y, row, card) {
            const m = document.createElement('div');
            m.className = 'cmenu';
            m.innerHTML = `<div class="cmhead"><div class="cmmeta"><div class="cmtitle">loading formats…</div></div></div>`;
            document.body.appendChild(m);
            const place = () => {
                const r = m.getBoundingClientRect();
                m.style.left = Math.max(8, Math.min(x, window.innerWidth - r.width - 8)) + 'px';
                m.style.top = Math.max(8, Math.min(y, window.innerHeight - r.height - 8)) + 'px';
            };
            place();
            spotlightCard(card);
            requestAnimationFrame(() => requestAnimationFrame(() => m.classList.add('show')));
            ctxMenu = m;
            const res = await ipcRenderer.invoke('download:formats', row.url);
            if (ctxMenu !== m) return; // superseded
            if (!res || !res.ok || !res.formats || !res.formats.length) {
                m.innerHTML = `<div class="cmhead"><div class="cmmeta"><div class="cmtitle">no downloads available</div></div></div>`;
                return;
            }
            m.innerHTML = '';
            for (const f of res.formats) {
                const b = document.createElement('button');
                b.className = 'cmi';
                b.innerHTML = `${ICON_DL}${escapeHtml(f.label)}`;
                b.addEventListener('click', (e) => {
                    e.stopPropagation();
                    closeTrackMenu();
                    ipcRenderer.send('downloads:art-hint', row.art);
                    void ipcRenderer.invoke('download:start', f.url);
                });
                m.appendChild(b);
            }
            place();
        }
        // spotlight: dim every card while a card menu is open, keep the source
        // card bright. cleared by the menu closers.
        let spotCard = null;
        function spotlightCard(card) {
            clearSpotlight();
            spotCard = card;
            card.classList.add('spot');
            const gs = [document.getElementById('albums'), document.getElementById('singles')];
            gs.forEach((g) => { if (g) g.classList.add('dim'); });
        }
        function clearSpotlight() {
            if (spotCard) {
                spotCard.classList.remove('spot');
                spotCard = null;
            }
            const gs = [document.getElementById('albums'), document.getElementById('singles')];
            gs.forEach((g) => { if (g) g.classList.remove('dim'); });
        }
        let fsOverlay = null;
        function showArtFullscreen(url) {
            if (!url || fsOverlay) return;
            const back = document.createElement('div');
            back.className = 'fsback';
            const img = document.createElement('img');
            img.src = url;
            img.className = 'fsimg';
            back.appendChild(img);
            const close = () => {
                back.remove();
                fsOverlay = null;
                document.removeEventListener('keydown', onKey);
            };
            const onKey = (e) => { if (e.key === 'Escape') close(); };
            back.addEventListener('click', close);
            document.addEventListener('keydown', onKey);
            document.body.appendChild(back);
            fsOverlay = back;
        }
        function closeTrackMenu() {
            clearSpotlight();
            if (!ctxMenu) return;
            const m = ctxMenu;
            ctxMenu = null;
            // exit: fade/scale out, then drop the node
            m.classList.remove('show');
            setTimeout(() => m.remove(), 140);
        }
        document.addEventListener('click', closeTrackMenu);
        document.addEventListener('wheel', closeTrackMenu, { passive: true });
        document.addEventListener('contextmenu', (e) => {
            if (ctxMenu && !ctxMenu.contains(e.target)) closeTrackMenu();
        });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeTrackMenu(); });
        const $ = (id) => document.getElementById(id);
        const escapeHtml = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        const fmtDur = (s) => (!s || s < 0 ? '' : Math.floor(s / 60) + ':' + Math.floor(s % 60).toString().padStart(2, '0'));

        let data = null;
        let tlEl = null;
        let openId = '';
        let openAlbumPageOn = false;
        // the view reloads on every open, so a fresh settings:get is enough -
        // no broadcast needed (the collection view gets it from main directly)
        void ipcRenderer.invoke('settings:get').then((s) => { openAlbumPageOn = !!(s && s.openAlbumPage); });
        const closeTracklist = () => { if (tlEl) { tlEl.remove(); tlEl = null; } openId = ''; };

        // album page loading: the clicked card's cover blurs with a centered
        // lottie while main fetches the release; album:loading-done clears it
        // on success and on failure alike (same as the collection/search view)
        let loadingCard = null;
        let cardSpinAnim = null;
        // a .lottie file is a zip: EOCD -> central directory -> local headers,
        // with deflate entries (zlib) and stored ones passed through; manifest.json
        // names the animation, which lives at animations/<id>.json
        function dotLottieToJson(buf) {
            try {
                const findSig = (from, to, sig) => {
                    for (let i = from; i >= to; i--) {
                        if (buf.readUInt32LE(i) === sig) return i;
                    }
                    return -1;
                };
                const eocd = findSig(buf.length - 22, Math.max(0, buf.length - 65557), 0x06054b50);
                if (eocd < 0) return null;
                const count = buf.readUInt16LE(eocd + 10);
                const cdOff = buf.readUInt32LE(eocd + 16);
                const entries = [];
                let p = cdOff;
                for (let i = 0; i < count; i++) {
                    if (buf.readUInt32LE(p) !== 0x02014b50) return null;
                    const method = buf.readUInt16LE(p + 10);
                    const csize = buf.readUInt32LE(p + 20);
                    const lho = buf.readUInt32LE(p + 42);
                    const nlen = buf.readUInt16LE(p + 28);
                    const elen = buf.readUInt16LE(p + 30);
                    const clen = buf.readUInt16LE(p + 32);
                    entries.push({ name: buf.toString('utf8', p + 46, p + 46 + nlen), method, csize, lho });
                    p += 46 + nlen + elen + clen;
                }
                const readFile = (name) => {
                    const f = entries.find((x) => x.name === name);
                    if (!f) return null;
                    if (buf.readUInt32LE(f.lho) !== 0x04034b50) return null;
                    const nlen = buf.readUInt16LE(f.lho + 26);
                    const elen = buf.readUInt16LE(f.lho + 28);
                    const data = buf.subarray(f.lho + 30 + nlen + elen, f.lho + 30 + nlen + elen + f.csize);
                    if (f.method === 0) return data;
                    if (f.method === 8) return require('zlib').inflateRawSync(data);
                    return null;
                };
                const manifest = readFile('manifest.json');
                if (!manifest) return null;
                const m = JSON.parse(manifest.toString('utf8'));
                const id = m && m.animations && m.animations[0] && m.animations[0].id;
                if (!id) return null;
                const anim = readFile('animations/' + id + '.json');
                return anim ? JSON.parse(anim.toString('utf8')) : null;
            } catch (e) { return null; }
        }
        function startCardLoading(card) {
            clearCardLoading();
            loadingCard = card;
            card.classList.add('loading');
            const sp = document.createElement('div');
            sp.className = 'card-spin';
            const host = card.querySelector('.artwrap') || card;
            host.appendChild(sp);
            try {
                const fs = require('fs');
                const path = require('path');
                const dir = path.join(__dirname, '..', '..', 'assets', 'lottie');
                let animData = null;
                const lottiePath = path.join(dir, 'loading.lottie');
                const legacyPath = path.join(dir, 'loading.json');
                if (fs.existsSync(lottiePath)) animData = dotLottieToJson(fs.readFileSync(lottiePath));
                if (!animData && fs.existsSync(legacyPath)) animData = JSON.parse(fs.readFileSync(legacyPath, 'utf8'));
                cardSpinAnim = require('../../assets/lottie/lottie.min.js').loadAnimation({
                    container: sp, renderer: 'svg', loop: true, autoplay: true,
                    animationData: animData,
                });
            } catch (e) { cardSpinAnim = null; }
        }
        function clearCardLoading() {
            if (cardSpinAnim) { try { cardSpinAnim.destroy(); } catch (e) { /* already gone */ } cardSpinAnim = null; }
            if (!loadingCard) return;
            loadingCard.classList.remove('loading');
            const sp = loadingCard.querySelector('.card-spin');
            if (sp) sp.remove();
            loadingCard = null;
        }
        ipcRenderer.on('album:loading-done', () => clearCardLoading());

        function endOfRow(card) {
            const grid = card.parentElement;
            const cards = Array.from(grid.querySelectorAll('.card'));
            const top = card.offsetTop;
            let last = card;
            for (const c of cards) { if (c.offsetTop === top) last = c; else if (c.offsetTop > top) break; }
            return last;
        }

        function buildCard(row, index, grid, clickHandler, menuFn) {
            const card = document.createElement('div');
            card.className = 'card';
            card.title = row.url;
            card.innerHTML =
                `<div class="artwrap"><img class="art" loading="lazy" src="${(row.art || '').replace(/"/g, '&quot;')}"></div>` +
                `<div class="t">${escapeHtml(row.title)}</div>` +
                `<div class="a">${escapeHtml(row.artist || data.name || '')}</div>` +
                (row.year ? `<div class="y">${row.year}</div>` : '');
            const img = card.querySelector('img.art');
            if (img) {
                const show = () => img.classList.add('in');
                if (img.complete && img.naturalWidth) show();
                else {
                    img.addEventListener('load', show);
                    img.addEventListener('error', show);
                }
            }
            card.id = 'card-' + index;
            card.addEventListener('click', () => { void clickHandler(row, card); });
            if (menuFn) {
                card.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    menuFn(e.clientX, e.clientY, row, card);
                });
            }
            grid.appendChild(card);
            return card;
        }

        async function toggleTracklist(row, card) {
            const id = card.id;
            const wasOpen = openId === id && !!tlEl;
            closeTracklist();
            if (wasOpen) return;
            openId = id;
            const panel = document.createElement('div');
            panel.className = 'tlinline';
            panel.addEventListener('click', (e) => e.stopPropagation());
            panel.innerHTML =
                (row.art ? `<div class="tlbg"><img class="tlbg-img" src="${row.art.replace(/"/g, '&quot;')}" alt=""></div>` : '') +
                `<div class="tlleft"><img class="tlart" src="${(row.art || '').replace(/"/g, '&quot;')}">` +
                `<div class="tltitle">${escapeHtml(row.title)}</div>` +
                `<div class="tlartist">${escapeHtml(row.artist || data.name || '')}</div>` +
                `<div class="tlbtns"><button class="tlplayall">Play all</button>` +
                `<button class="tlqueue">Queue</button><button class="tlopen">Open album</button><button class="tlclosebtn">Close</button></div></div>` +
                `<div class="tlright"><div class="tlstate">loading tracklist…</div></div>`;
            endOfRow(card).after(panel);
            tlEl = panel;
            const right = panel.querySelector('.tlright');
            panel.querySelector('.tlclosebtn').addEventListener('click', closeTracklist);
            panel.querySelector('.tlopen').addEventListener('click', () => {
                ipcRenderer.send('album:open', { url: row.url, artUrl: row.art, title: row.title });
            });
            const q = { tralbumId: String(row.tralbumId), tralbumType: row.tralbumType, bandId: String(data.bandId) };
            panel.querySelector('.tlplayall').addEventListener('click', () => { void ipcRenderer.invoke('collection:play', { ...q, activeIndex: 0 }); });
            panel.querySelector('.tlqueue').addEventListener('click', async (e) => {
                const b = e.target; b.textContent = 'adding…';
                const r = await ipcRenderer.invoke('collection:enqueue', q);
                b.textContent = r && r.ok ? 'added ✓' : 'failed';
            });
            const res = await ipcRenderer.invoke('collection:tracklist', q);
            if (tlEl !== panel) return;
            if (!res.ok || !res.tracks || !res.tracks.length) {
                right.innerHTML = `<div class="tlstate">couldn't load the tracklist</div>`;
                return;
            }
            if (res.year) {
                const yr = panel.querySelector('.tlartist');
                yr.textContent = (yr.textContent + ' · ' + res.year).trim();
            }
            right.innerHTML = '';
            res.tracks.forEach((t, i) => {
                const rowEl = document.createElement('div');
                rowEl.className = 'tlrow';
                rowEl.innerHTML =
                    `<span class="tlnum">${i + 1}</span>` +
                    `<span class="tltrk">${escapeHtml(t.title)}</span>` +
                    `<span class="tldur">${fmtDur(t.duration)}</span>`;
                rowEl.addEventListener('click', () => { void ipcRenderer.invoke('collection:play', { ...q, activeIndex: i }); });
                if (t.id) {
                    rowEl.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        openTrackMenu(e.clientX, e.clientY, {
                            title: t.title, artist: row.artist || data.name || '', year: res.year || 0, art: row.art || '',
                            queue: () => { void ipcRenderer.invoke('collection:enqueue', { ...q, trackId: t.id }); },
                            download: () => { void ipcRenderer.invoke('download:track', { tralbumId: q.tralbumId, tralbumType: q.tralbumType, bandId: q.bandId, trackId: t.id }); },
                        });
                    });
                }
                right.appendChild(rowEl);
            });
        }

        function render(d) {
            data = d;
            closeTracklist();
            $('hero-bg').style.backgroundImage = d.bannerUrl ? `url("${d.bannerUrl}")` : (d.photoUrl ? `url("${d.photoUrl}")` : '');
            const photo = $('hero-photo');
            if (d.photoUrl) photo.src = d.photoUrl; else photo.style.display = 'none';
            $('hero-name').textContent = d.name;
            const metaParts = [];
            if (d.location) metaParts.push(escapeHtml(d.location));
            if (d.website) metaParts.push(`<a href="${escapeHtml(d.website)}">${escapeHtml(d.website)}</a>`);
            $('hero-meta').innerHTML = metaParts.join(' <span class="dot">·</span> ');
            $('bio').textContent = d.bio;
            $('bio').style.display = d.bio ? '' : 'none';
            const albums = d.discography.filter((r) => r.tralbumType === 'a');
            const singles = d.discography.filter((r) => r.tralbumType === 't');
            $('albums-cnt').textContent = albums.length ? `(${albums.length})` : '';
            $('singles-cnt').textContent = singles.length ? `(${singles.length})` : '';
            $('sec-albums').style.display = albums.length ? '' : 'none';
            $('sec-singles').style.display = singles.length ? '' : 'none';
            const ag = $('albums');
            const sg = $('singles');
            ag.innerHTML = '';
            sg.innerHTML = '';
            albums.forEach((r, i) => buildCard(r, 'a' + i, ag, (row, card) => {
                if (openAlbumPageOn && row.url) {
                    startCardLoading(card);
                    ipcRenderer.send('album:open', { url: row.url, artUrl: row.art, title: row.title });
                    return;
                }
                toggleTracklist(row, card);
            }, openAlbumMenu));
            singles.forEach((r, i) => {
                buildCard(r, 't' + i, sg, (row) => {
                    void ipcRenderer.invoke('collection:play', { tralbumId: String(row.tralbumId), tralbumType: 't', bandId: String(data.bandId), activeIndex: 0 });
                });
            });
            $('playall').disabled = d.discography.length === 0;
            $('playall').style.opacity = d.discography.length ? '' : '.4';
            $('dlall').disabled = d.discography.length === 0;
            $('dlall').style.opacity = d.discography.length ? '' : '.4';
            setFollowBtn(d.isFollowing);
            $('err').style.display = 'none';
        }

        function setFollowBtn(following) {
            const b = $('follow');
            b.classList.toggle('following', !!following);
            b.innerHTML = following ? ICON_FOLLOWED : ICON_FOLLOW;
            b.title = following ? 'Unfollow' : 'Follow';
        }

        // mouse back/forward buttons close/reopen the overlay like the header's < >
        window.addEventListener('mouseup', (e) => {
            if (e.button === 3) ipcRenderer.send('artist:close');
            if (e.button === 4) ipcRenderer.send('app:forward');
        });
        $('follow').addEventListener('click', () => {
            if (!data) return;
            ipcRenderer.send('artist:follow', { url: data.url, bandId: data.bandId, follow: !data.isFollowing });
            $('follow').title = '…';
        });
        $('playall').addEventListener('click', () => {
            if (!data || !data.discography.length) return;
            ipcRenderer.send('artist:play', {
                discography: data.discography.map((r) => ({ tralbumId: r.tralbumId, tralbumType: r.tralbumType, bandId: data.bandId })),
            });
        });
        // download the whole discography: confirm first in a small dialog window
        $('dlall').addEventListener('click', () => {
            if (!data || !data.discography.length) return;
            ipcRenderer.send('artist:download-ask', {
                count: data.discography.length,
                releases: data.discography.map((r) => ({ url: r.url, title: (data.name || '') + ' - ' + r.title, art: r.art })),
            });
        });

        ipcRenderer.on('artist:data', (_e, p) => {
            const d = p && p.data;
            if (!d || !d.ok) {
                data = null;
                $('err').textContent = (d && d.error) || 'couldn\'t load this artist';
                $('err').style.display = '';
                return;
            }
            render(d);
        });
        // release years stream in one at a time (paced, rate-limiter friendly);
        // fill each card's year line as its value arrives.
        ipcRenderer.on('artist:year', (_e, p) => {
            if (!p || !data || !p.year) return;
            if (p.bandId && data.bandId && p.bandId !== data.bandId) return;
            const card = document.getElementById('card-a' + p.index) || document.getElementById('card-t' + p.index);
            if (!card) return;
            let y = card.querySelector('.y');
            if (!y) {
                y = document.createElement('div');
                y.className = 'y';
                card.appendChild(y);
            }
            y.textContent = String(p.year);
        });
        ipcRenderer.on('artist:follow-result', (_e, p) => {
            if (!p) return;
            if (p.ok && data) data.isFollowing = !!p.isFollowing;
            setFollowBtn(data ? !!data.isFollowing : false);
            if (!p.ok) {
                $('follow').title = (p.error || 'failed') + ' — try again';
                setTimeout(() => { if (data) setFollowBtn(data.isFollowing); }, 1800);
            }
        });
    </script>
</body>
</html>

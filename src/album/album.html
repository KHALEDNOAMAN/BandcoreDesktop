<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Album</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; scrollbar-width: none; -ms-overflow-style: none; }
        ::-webkit-scrollbar { width: 0; height: 0; display: none; }
        :root {
            --bg: #181a1b; --titlebar: #121415; --input: #121415; --bar: #1b1e1f;
            --panel: #161819; --card: #202325; --hover-bg: #24282a;
            --line: #2a2e30; --line-2: #1e2224; --scroll: #3a3f42;
            --text: #e8e6e3; --text-2: #cfcac2; --muted: #9a968e; --sub: #848079;
            --accent: #1da0c3; --hover-text: #ffffff;
        }
        html, body { height: 100%; }
        body {
            background: var(--bg); color: var(--text); overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Roboto, sans-serif;
            display: flex; flex-direction: column; user-select: none;
            /* overlay transition: the view fades in when it opens (the page
               behind shows through until it's done) */
            animation: overlay-in .26s ease-out;
        }
        @keyframes overlay-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        .scroll { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }
        .hero {
            position: relative; padding: 72px 26px 40px;
            display: flex; gap: 24px; align-items: center;
            /* the bg bleeds -40px on each side for the blur; clip only
               horizontally so the vertical bleed into the tracklist stays */
            overflow-x: clip;
        }
        .hero-inner { position: relative; z-index: 1; display: flex; gap: 24px; align-items: flex-end; min-width: 0; flex: 1; }
        .hero-bg {
            position: absolute; left: -40px; top: -60px; right: -40px; bottom: -80px;
            background-size: cover; background-position: center;
            filter: blur(26px) brightness(.55) saturate(1.15);
            transform: scale(1.25); pointer-events: none;
        }
        .hero-bg.fade {
            -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 28%, transparent 100%);
            mask-image: linear-gradient(to bottom, #000 0%, #000 28%, transparent 100%);
        }
        .hero-art {
            width: 230px; height: 230px; border-radius: 12px; object-fit: cover;
            border: 1px solid rgba(255,255,255,.12); flex-shrink: 0;
            box-shadow: 0 12px 34px rgba(0,0,0,.5); background: var(--line);
            opacity: 0; transition: opacity .4s ease;
        }
        .hero-art.in { opacity: 1; }
        .hero-info { min-width: 0; padding-bottom: 2px; }
        .hero-title { font-size: 2.5rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; text-shadow: 0 2px 12px rgba(0,0,0,.5); }
        .hero-artist { font-size: 1rem; color: var(--text-2); margin-top: 10px; text-shadow: 0 1px 8px rgba(0,0,0,.4); }
        .hero-artist a { color: var(--text-2); text-decoration: none; }
        .hero-artist a:hover { color: var(--accent); text-decoration: underline; }
        .hero-meta { font-size: 0.8125rem; color: var(--muted); margin-top: 10px; display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
        .hero-meta .dot { color: var(--sub); }
        .genre {
            display: inline-block; margin-top: 10px; font-size: 0.6562rem; letter-spacing: .04em;
            color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
            background: color-mix(in srgb, var(--accent) 12%, transparent);
            border-radius: 999px; padding: 3px 10px;
        }
        .hero-btns { display: flex; align-items: center; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
        .hbtn {
            display: inline-flex; align-items: center; justify-content: center;
            width: 44px; height: 44px; padding: 0; border-radius: 50%;
            border: 1px solid transparent; background: var(--hover-bg);
            color: var(--text); cursor: pointer; font-family: inherit;
        }
        .hbtn:hover { border-color: var(--accent); }
        .hbtn.primary { background: #fff; color: #000; width: 56px; height: 56px; }
        .hbtn.primary:hover { border-color: var(--accent); filter: brightness(.94); }
        .hbtn:active { transform: scale(.96); transition: transform .08s ease; }
        .hbtn svg { width: 16px; height: 16px; display: block; }
        .hbtn.primary svg { width: 22px; height: 22px; }
        .section { position: relative; z-index: 1; padding: 20px 26px 6px; }
        .section h2 { font-size: 0.875rem; font-weight: 700; letter-spacing: .02em; margin-bottom: 12px; }
        .tlrows { display: grid; grid-template-columns: 1fr; gap: 2px; align-content: start; }
        .tlrow {
            display: flex; align-items: center; gap: 10px; padding: 6px 8px; cursor: pointer;
            font-size: 0.8125rem; border-radius: 5px; height: 34px;
        }
        .tlrow:hover { background: rgba(255,255,255,.06); }
        .tlnum { width: 22px; text-align: right; color: var(--sub); font-size: 0.75rem; flex-shrink: 0; }
        /* the playing anim lives inside the title span, right after the text;
           the slot is always there (opacity 0 -> 1) so rows never shift when
           the anim appears */
        .tlplaying {
            display: inline-flex; align-items: center; justify-content: center;
            width: 18px; height: 18px; margin-left: 9px; vertical-align: middle;
            flex-shrink: 0; opacity: 0; transition: opacity .3s ease;
        }
        .tlplaying.show { opacity: 1; }
        .tlplaying svg { width: 18px; height: 18px; display: block; }
        .tltrk { flex: 2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: font-size .35s ease, font-weight .35s ease, color .35s ease; }
        .tlrow.playing .tltrk { font-size: 0.9062rem; font-weight: 700; color: var(--text); }
        .tla { color: var(--muted); font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 0 240px; max-width: 240px; text-align: left; }
        .tldur { color: var(--sub); font-size: 0.75rem; flex: 1; text-align: right; }
        .tlhead {
            display: flex; align-items: center; gap: 10px; padding: 0 8px 6px;
            font-size: 0.6562rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
            color: var(--sub);
        }
        .tlhead .hnum { width: 22px; flex-shrink: 0; }
        .tlhead .htrk { flex: 2; }
        .tlhead .hla { flex: 0 0 240px; max-width: 240px; }
        .tlhead .hld { flex: 1; text-align: right; display: flex; justify-content: flex-end; }
        .tlhead svg { width: 14px; height: 14px; display: block; }
        .about { font-size: 0.8125rem; color: var(--muted); line-height: 1.6; max-width: 860px; padding-bottom: 16px; }
        .about .date { color: var(--sub); font-size: 0.75rem; margin-bottom: 8px; }
        .credits { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px 24px; padding-bottom: 18px; }
        .cre { font-size: 0.75rem; display: flex; justify-content: space-between; gap: 12px; }
        .cre .role { color: var(--sub); flex-shrink: 0; }
        .cre .who { color: var(--text-2); text-align: right; }
        .empty { padding: 26px; color: var(--muted); font-size: 0.8125rem; }

        /* per-track context menu (right-click a track row) */
        .cmenu {
            position: fixed; z-index: 999; min-width: 210px; padding: 4px;
            background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
            box-shadow: 0 10px 28px rgba(0,0,0,.4);
            opacity: 0; transform: scale(.96) translateY(-3px);
            transition: opacity .12s ease, transform .12s ease;
            pointer-events: none;
        }
        .cmenu.show { opacity: 1; transform: none; pointer-events: auto; }
        .cmi {
            display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 10px;
            font-size: 0.75rem; color: var(--text); background: none; border: none;
            border-radius: 6px; cursor: pointer; font-family: inherit; text-align: left;
        }
        .cmi:hover { background: var(--hover-bg); color: var(--hover-text); }
        .cmi svg { width: 15px; height: 15px; flex-shrink: 0; }
        /* fullscreen cover art overlay */
        .fsback {
            position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,.88);
            display: flex; align-items: center; justify-content: center; cursor: zoom-out;
            animation: fsback-in .15s ease;
        }
        @keyframes fsback-in { from { opacity: 0; } to { opacity: 1; } }
        .fsimg {
            max-width: 92vw; max-height: 92vh; border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,.6); animation: fsimg-in .18s ease;
        }
        @keyframes fsimg-in { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
        .cmhead { display: flex; align-items: center; gap: 9px; padding: 6px 8px 7px; }
        .cmart { width: 38px; height: 38px; border-radius: 5px; object-fit: cover; flex-shrink: 0; }
        .cmmeta { min-width: 0; flex: 1; }
        .cmtitle { font-size: 0.75rem; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cmsub { font-size: 0.6875rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>
    <div class="scroll" id="scroll">
        <div class="hero" id="hero">
            <div class="hero-bg fade" id="hero-bg"></div>
            <div class="hero-inner">
                <img class="hero-art" id="hero-art" alt="">
                <div class="hero-info">
                    <div class="hero-title" id="hero-title"></div>
                    <div class="hero-artist" id="hero-artist"></div>
                    <div class="hero-meta" id="hero-meta"></div>
                    <div class="genre" id="genre" style="display:none"></div>
                    <div class="hero-btns">
                        <button class="hbtn primary" id="playall" title="Play album">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14z"/></svg>
                        </button>
                        <button class="hbtn" id="queuebtn" title="Add to queue">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 12H3"/><path d="M16 6H3"/><path d="M16 18H3"/><path d="M18 9v6"/><path d="M21 12h-6"/></svg>
                        </button>
                        <button class="hbtn" id="dlbtn" title="Download album">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="section">
            <div class="tlhead">
                <span class="hnum"></span>
                <span class="htrk">Track Title</span>
                <span class="hla">Artist</span>
                <span class="hld" id="durhead"></span>
            </div>
            <div class="tlrows" id="tracks"></div>
        </div>
        <div class="section" id="aboutsec" style="display:none">
            <h2>About</h2>
            <div class="about" id="about"></div>
        </div>
        <div class="section" id="credsec" style="display:none">
            <h2>Credits</h2>
            <div class="credits" id="credits"></div>
        </div>
    </div>
    <script>
        const { ipcRenderer } = require('electron');
        const MENU_ICON = 'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
        const ICON_DL = `<svg viewBox="0 0 24 24" fill="none" ${MENU_ICON}><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>`;
        // icons read from the shared set (assets/icons) so they can be edited
        // in one place; sized down + recolored for menu use
        const readIcon = (name) => {
            try {
                const fs = require('fs');
                const path = require('path');
                return fs.readFileSync(path.join(__dirname, '..', '..', 'assets', 'icons', name), 'utf8')
                    .replace(/width="24"/, 'width="15"')
                    .replace(/height="24"/, 'height="15"')
                    .replace(/stroke="#ffffff"/, 'stroke="currentColor"');
            } catch (e) { return ''; }
        };
        const ICON_FS = readIcon('cover_art_fs.svg');
        const ICON_CLIP = readIcon('clipboard.svg');
        let data = null;
        let ctxMenu = null;

        const $ = (id) => document.getElementById(id);
        const escapeHtml = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        const fmtDur = (s) => (!s || s < 0 ? '' : Math.floor(s / 60) + ':' + Math.floor(s % 60).toString().padStart(2, '0'));

        // duration column header icon, read from the shared icon set
        // (assets/icons/track_duration.svg) so it can be edited in one place
        try {
            const fs = require('fs');
            const path = require('path');
            const svg = fs.readFileSync(path.join(__dirname, '..', '..', 'assets', 'icons', 'track_duration.svg'), 'utf8')
                .replace(/width="24"/, 'width="14"')
                .replace(/height="24"/, 'height="14"')
                .replace(/stroke="#ffffff"/, 'stroke="currentColor"');
            $('durhead').innerHTML = svg;
        } catch (e) { /* decorative icon; fine to skip */ }

        // playing-track indicator: a lottie (playing.lottie, a zip: EOCD ->
        // central directory -> local headers, deflate via zlib) shown beside
        // the current track, whose row is also raised & bolded.
        function dotLottieToJson(buf) {
            try {
                const findSig = (from, to, sig) => {
                    for (let i = from; i >= to; i--) {
                        if (buf.readUInt32LE(i) === sig) return i;
                    }
                    return -1;
                };
                const eocd = findSig(buf.length - 22, Math.max(0, buf.length - 65557), 0x06054b50);
                if (eocd < 0) return null;
                const count = buf.readUInt16LE(eocd + 10);
                const cdOff = buf.readUInt32LE(eocd + 16);
                const entries = [];
                let p = cdOff;
                for (let i = 0; i < count; i++) {
                    if (buf.readUInt32LE(p) !== 0x02014b50) return null;
                    const method = buf.readUInt16LE(p + 10);
                    const csize = buf.readUInt32LE(p + 20);
                    const lho = buf.readUInt32LE(p + 42);
                    const nlen = buf.readUInt16LE(p + 28);
                    const elen = buf.readUInt16LE(p + 30);
                    const clen = buf.readUInt16LE(p + 32);
                    entries.push({ name: buf.toString('utf8', p + 46, p + 46 + nlen), method, csize, lho });
                    p += 46 + nlen + elen + clen;
                }
                const readFile = (name) => {
                    const f = entries.find((x) => x.name === name);
                    if (!f) return null;
                    if (buf.readUInt32LE(f.lho) !== 0x04034b50) return null;
                    const nlen = buf.readUInt16LE(f.lho + 26);
                    const elen = buf.readUInt16LE(f.lho + 28);
                    const data = buf.subarray(f.lho + 30 + nlen + elen, f.lho + 30 + nlen + elen + f.csize);
                    if (f.method === 0) return data;
                    if (f.method === 8) return require('zlib').inflateRawSync(data);
                    return null;
                };
                const manifest = readFile('manifest.json');
                if (!manifest) return null;
                const m = JSON.parse(manifest.toString('utf8'));
                const id = m && m.animations && m.animations[0] && m.animations[0].id;
                if (!id) return null;
                const anim = readFile('animations/' + id + '.json');
                return anim ? JSON.parse(anim.toString('utf8')) : null;
            } catch (e) { return null; }
        }
        let playingAnim = null;
        let playingRow = null;
        let lastNP = null;
        function setPlayingRow(row) {
            if (pauseRaf) { cancelAnimationFrame(pauseRaf); pauseRaf = null; }
            if (playingRow) {
                playingRow.classList.remove('playing');
                const s = playingRow.querySelector('.tlplaying');
                if (s) s.classList.remove('show');
            }
            if (playingAnim) {
                const old = playingAnim;
                try { old.pause(); } catch (e) { /* already gone */ }
                // keep the svg around for the fade-out (opacity transition on
                // .tlplaying) before destroying the animation
                setTimeout(() => { try { old.destroy(); } catch (e) { /* already gone */ } }, 400);
                playingAnim = null;
            }
            playingRow = row;
            if (!row) return;
            row.classList.add('playing');
            const host = row.querySelector('.tlplaying');
            if (!host) return;
            host.classList.add('show');
            host.innerHTML = '';
            try {
                const fs = require('fs');
                const path = require('path');
                const lottiePath = path.join(__dirname, '..', '..', 'assets', 'lottie', 'playing.lottie');
                const animData = fs.existsSync(lottiePath) ? dotLottieToJson(fs.readFileSync(lottiePath)) : null;
                if (animData) {
                    playingAnim = require('../../assets/lottie/lottie.min.js').loadAnimation({
                        container: host, renderer: 'svg', loop: true, autoplay: true,
                        animationData: animData,
                    });
                }
            } catch (e) { playingAnim = null; }
        }
        function applyPlaying() {
            let row = null;
            if (data && lastNP && String(lastNP.tralbumId) === String(data.tralbumId)) {
                const idx = data.tracks.findIndex((t) => String(t.id) === String(lastNP.id));
                if (idx >= 0) row = document.querySelectorAll('.tlrow')[idx] || null;
            }
            setPlayingRow(row);
            if (playingRow) syncPlayingAnim(lastNP ? lastNP.isPlaying === true : true);
        }
        let pauseRaf = null;
        function syncPlayingAnim(play) {
            if (!playingAnim) return;
            if (play) {
                if (pauseRaf) { cancelAnimationFrame(pauseRaf); pauseRaf = null; }
                try { playingAnim.play(); playingAnim.setSpeed(1); } catch (e) { /* already gone */ }
                return;
            }
            if (pauseRaf) return;
            // ease the playback speed down to a crawl, then freeze the last
            // frame - a smooth stop instead of a hard pause
            const t0 = performance.now();
            const dur = 450;
            const step = () => {
                const k = Math.min(1, (performance.now() - t0) / dur);
                try { playingAnim.setSpeed(Math.max(0.001, 1 - k * k)); } catch (e) { pauseRaf = null; return; }
                if (k >= 1) {
                    try { playingAnim.pause(); playingAnim.setSpeed(1); } catch (e) { /* already gone */ }
                    pauseRaf = null;
                    return;
                }
                pauseRaf = requestAnimationFrame(step);
            };
            pauseRaf = requestAnimationFrame(step);
        }
        ipcRenderer.on('album:now-playing', (_e, np) => {
            const sameTrack = lastNP && np &&
                String(lastNP.id) === String(np.id) &&
                String(lastNP.tralbumId) === String(np.tralbumId);
            lastNP = np || null;
            if (sameTrack) { syncPlayingAnim(np.isPlaying === true); return; }
            applyPlaying();
        });

        // per-track context menu (right-click a track row): add to queue / download
        function openTrackMenu(x, y, info, actions) {
            closeTrackMenu();
            const m = document.createElement('div');
            m.className = 'cmenu';
            const head = (info.art || info.title)
                ? `<div class="cmhead">` +
                  (info.art ? `<img class="cmart" src="${info.art.replace(/"/g, '&quot;')}" alt="">` : '') +
                  `<div class="cmmeta">` +
                  `<div class="cmtitle">${escapeHtml(info.title || '')}</div>` +
                  (info.artist ? `<div class="cmsub">${escapeHtml(info.artist)}</div>` : '') +
                  (info.year ? `<div class="cmsub">${escapeHtml(String(info.year))}</div>` : '') +
                  `</div></div>`
                : '';
            m.innerHTML = head +
                `<button class="cmi" data-a="queue"><svg viewBox="0 0 24 24" fill="none" ${MENU_ICON}><path d="M5 12h14"/><path d="M12 5v14"/></svg>Add song to queue</button>` +
                `<button class="cmi" data-a="dl"><svg viewBox="0 0 24 24" fill="none" ${MENU_ICON}><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>Download track</button>` +
                `<button class="cmi" data-a="search"><svg viewBox="0 0 24 24" fill="none" ${MENU_ICON}><circle cx="10" cy="8" r="5"/><path d="M2 21a8 8 0 0 1 10.434-7.62"/><circle cx="18" cy="18" r="3"/><path d="m22 22-1.9-1.9"/></svg>Search ${escapeHtml(info.artist || '')}</button>`;
            document.body.appendChild(m);
            const r = m.getBoundingClientRect();
            m.style.left = Math.max(8, Math.min(x, window.innerWidth - r.width - 8)) + 'px';
            m.style.top = Math.max(8, Math.min(y, window.innerHeight - r.height - 8)) + 'px';
            m.addEventListener('click', (e) => {
                const b = e.target.closest('.cmi');
                if (!b) return;
                closeTrackMenu();
                if (b.dataset.a === 'queue') info.queue();
                else if (b.dataset.a === 'dl') info.download();
                else {
                    const artist = (info.artist || '').trim();
                    if (artist) ipcRenderer.send('search:run', { text: artist, mode: 'all' });
                }
            });
            // enter: added hidden, shown on the next frames so the transition runs
            requestAnimationFrame(() => requestAnimationFrame(() => m.classList.add('show')));
            ctxMenu = m;
        }
        function closeTrackMenu() {
            if (!ctxMenu) return;
            const m = ctxMenu;
            ctxMenu = null;
            // exit: fade/scale out, then drop the node
            m.classList.remove('show');
            setTimeout(() => m.remove(), 140);
        }
        document.addEventListener('click', closeTrackMenu);
        document.addEventListener('wheel', closeTrackMenu, { passive: true });
        document.addEventListener('contextmenu', (e) => {
            if (ctxMenu && !ctxMenu.contains(e.target)) closeTrackMenu();
        });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeTrackMenu(); });

        // cover art context menu (right-click the hero art): view fullscreen,
        // download, or copy to the clipboard. same look as the track menu,
        // head carries the compact release info.
        function openArtMenu(x, y) {
            closeTrackMenu();
            if (!data || !data.artUrl) return;
            const m = document.createElement('div');
            m.className = 'cmenu';
            m.innerHTML =
                `<div class="cmhead">` +
                `<img class="cmart" src="${data.artUrl.replace(/"/g, '&quot;')}" alt="">` +
                `<div class="cmmeta">` +
                `<div class="cmtitle">${escapeHtml(data.title || '')}</div>` +
                `<div class="cmsub">${escapeHtml((data.artist || data.bandName || '').trim())}</div>` +
                `</div></div>` +
                `<button class="cmi" data-a="fs">${ICON_FS}View cover art</button>` +
                `<button class="cmi" data-a="dl">${ICON_DL}Download cover art</button>` +
                `<button class="cmi" data-a="copy">${ICON_CLIP}Copy to clipboard</button>`;
            document.body.appendChild(m);
            const r = m.getBoundingClientRect();
            m.style.left = Math.max(8, Math.min(x, window.innerWidth - r.width - 8)) + 'px';
            m.style.top = Math.max(8, Math.min(y, window.innerHeight - r.height - 8)) + 'px';
            m.addEventListener('click', (e) => {
                const b = e.target.closest('.cmi');
                if (!b) return;
                closeTrackMenu();
                if (b.dataset.a === 'fs') showArtFullscreen();
                else if (b.dataset.a === 'dl') ipcRenderer.send('download:art', { url: data.artUrl, title: data.title, artist: data.artist || data.bandName });
                else void ipcRenderer.invoke('art:copy', { url: data.artUrl });
            });
            requestAnimationFrame(() => requestAnimationFrame(() => m.classList.add('show')));
            ctxMenu = m;
        }
        let fsOverlay = null;
        function showArtFullscreen() {
            if (!data || !data.artUrl || fsOverlay) return;
            const back = document.createElement('div');
            back.className = 'fsback';
            const img = document.createElement('img');
            img.src = data.artUrl;
            img.className = 'fsimg';
            back.appendChild(img);
            const close = () => {
                back.remove();
                fsOverlay = null;
                document.removeEventListener('keydown', onKey);
            };
            const onKey = (e) => { if (e.key === 'Escape') close(); };
            back.addEventListener('click', close);
            document.addEventListener('keydown', onKey);
            document.body.appendChild(back);
            fsOverlay = back;
        }
        $('hero-art').addEventListener('contextmenu', (e) => {
            e.preventDefault();
            e.stopPropagation();
            openArtMenu(e.clientX, e.clientY);
        });

        // mouse back/forward buttons close/reopen the overlay like the header's < >
        window.addEventListener('mouseup', (e) => {
            if (e.button === 3) ipcRenderer.send('album:close');
            if (e.button === 4) ipcRenderer.send('app:forward');
        });

        const fmtDate = (iso) => {
            if (!iso) return '';
            const d = new Date(iso + 'T00:00:00');
            if (isNaN(d.getTime())) return iso;
            return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        };

        ipcRenderer.on('album:data', (_e, p) => {
            const d = p && p.data;
            if (!d || !d.ok) return;
            data = d;
            $('hero-bg').style.backgroundImage = d.artUrl ? `url("${d.artUrl}")` : '';
            const art = $('hero-art');
            art.src = d.artUrl || '';
            if (d.artUrl) {
                if (art.complete && art.naturalWidth) art.classList.add('in');
                else art.onload = () => art.classList.add('in');
            }
            $('hero-title').textContent = d.title;
            const a = (d.artist || '').trim();
            const b = (d.bandName || '').trim();
            // release artist first; the uploader only shows when it differs
            // ("by TETSURO on dojikko records"), and the bandlink always points
            // at the page main resolved the data from
            if (a && b && a !== b) {
                $('hero-artist').innerHTML = `by <b>${escapeHtml(a)}</b> on <a href="#" id="bandlink">${escapeHtml(b)}</a>`;
            } else if (b) {
                $('hero-artist').innerHTML = `by <a href="#" id="bandlink">${escapeHtml(a || b)}</a>`;
            } else {
                $('hero-artist').innerHTML = `by ${escapeHtml(a)}`;
            }
            const bl = $('bandlink');
            if (bl) bl.addEventListener('click', (e) => {
                e.preventDefault();
                ipcRenderer.send('artist:open', { url: d.bandUrl });
            });
            const parts = [];
            if (d.year) parts.push(escapeHtml(String(d.year)));
            parts.push(`${d.tracks.length} song${d.tracks.length === 1 ? '' : 's'}`);
            const total = d.tracks.reduce((s, t) => s + (t.duration || 0), 0);
            if (total) parts.push(`${Math.max(1, Math.round(total / 60))} min`);
            $('hero-meta').innerHTML = parts.map((p, i) => (i ? `<span class="dot">·</span>${p}` : p)).join(' ');
            const g = $('genre');
            if (d.genre) { g.textContent = d.genre; g.style.display = ''; } else { g.style.display = 'none'; }

            const q = { tralbumId: d.tralbumId, tralbumType: d.tralbumType, bandId: d.bandId };
            $('playall').addEventListener('click', () => { void ipcRenderer.invoke('collection:play', { ...q, activeIndex: 0 }); });
            $('queuebtn').addEventListener('click', async (e) => {
                const b = e.target.closest('button'); b.textContent = 'adding…';
                const r = await ipcRenderer.invoke('collection:enqueue', q);
                b.textContent = r && r.ok ? 'added ✓' : 'failed';
                setTimeout(() => { b.textContent = 'Add to queue'; }, 1200);
            });
            $('dlbtn').addEventListener('click', () => { void ipcRenderer.invoke('download:release', q); });

            const tl = $('tracks');
            tl.innerHTML = '';
            d.tracks.forEach((t, i) => {
                const row = document.createElement('div');
                row.className = 'tlrow';
                const trkArtist = t.artist || d.artist;
                row.innerHTML =
                    `<span class="tlnum">${i + 1}</span>` +
                    `<span class="tltrk">${escapeHtml(t.title)}<span class="tlplaying"></span></span>` +
                    `<span class="tla">${escapeHtml(trkArtist)}</span>` +
                    `<span class="tldur">${fmtDur(t.duration)}</span>`;
                row.addEventListener('click', () => { void ipcRenderer.invoke('collection:play', { ...q, activeIndex: i }); });
                if (t.id) {
                    row.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        openTrackMenu(e.clientX, e.clientY, {
                            title: t.title, artist: trkArtist, year: d.year, art: d.artUrl,
                            queue: () => { void ipcRenderer.invoke('collection:enqueue', { ...q, trackId: t.id }); },
                            download: () => { void ipcRenderer.invoke('download:track', { tralbumId: q.tralbumId, tralbumType: q.tralbumType, bandId: q.bandId, trackId: t.id }); },
                        });
                    });
                }
                tl.appendChild(row);
            });
            applyPlaying();

            const aboutSec = $('aboutsec');
            if (d.about || d.releaseDate) {
                aboutSec.style.display = '';
                const about = $('about');
                about.innerHTML = '';
                if (d.releaseDate) {
                    const date = document.createElement('div');
                    date.className = 'date';
                    date.textContent = 'Released ' + fmtDate(d.releaseDate);
                    about.appendChild(date);
                }
                if (d.about) {
                    const txt = document.createElement('div');
                    txt.textContent = d.about;
                    about.appendChild(txt);
                }
            } else {
                aboutSec.style.display = 'none';
            }

            const credSec = $('credsec');
            if (d.credits && d.credits.length) {
                credSec.style.display = '';
                $('credits').innerHTML = d.credits.slice(0, 24).map((c) =>
                    `<div class="cre"><span class="role">${escapeHtml(c.role || '')}</span><span class="who">${escapeHtml(c.name)}</span></div>`).join('');
            } else {
                credSec.style.display = 'none';
            }
        });
    </script>
</body>
</html>

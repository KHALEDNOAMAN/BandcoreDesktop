<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Bandcamp</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #181a1b; --titlebar: #121415; --input: #121415; --bar: #1b1e1f;
            --panel: #161819; --card: #202325; --hover-bg: #24282a;
            --line: #2a2e30; --line-2: #1e2224; --scroll: #3a3f42;
            --text: #e8e6e3; --text-2: #cfcac2; --muted: #9a968e; --sub: #848079;
            --accent: #1da0c3; --hover-text: #ffffff;
        }
        body {
            background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Roboto, sans-serif;
            font-size: 13px; user-select: none; display: flex; flex-direction: column;
            border: 1px solid var(--line); border-radius: 8px;
        }
        .bar { -webkit-app-region: drag; height: 30px; flex-shrink: 0; }
        .body { padding: 0 22px 18px; flex: 1; }
        h1 { font-size: 15px; margin-bottom: 8px; }
        p { font-size: 12px; color: var(--muted); line-height: 1.6; }
        .row { display: flex; gap: 8px; justify-content: flex-end; padding: 0 22px 18px; }
        button {
            background: var(--hover-bg); border: 1px solid var(--line); color: var(--text);
            border-radius: 6px; padding: 8px 14px; font-size: 12px; cursor: pointer; font-family: inherit;
        }
        button.primary { background: var(--accent); border-color: var(--accent); color: var(--hover-text); }
        button:hover { filter: brightness(1.12); }
    </style>
</head>
<body>
    <div class="bar"></div>
    <div class="body">
        <h1>Download discography?</h1>
        <p>You're about to download <b id="n" style="color: var(--text)">0</b> albums from this artist.
        They'll show up in the Downloads panel, one after another. It might take a while.</p>
    </div>
    <div class="row">
        <button id="cancel">Cancel</button>
        <button class="primary" id="dl">Download</button>
    </div>
    <script>
        const { ipcRenderer } = require('electron');
        const n = new URLSearchParams(location.search).get('n');
        if (n) document.getElementById('n').textContent = n;
        document.getElementById('cancel').onclick = () => ipcRenderer.send('dlprompt:cancel');
        document.getElementById('dl').onclick = () => ipcRenderer.send('dlprompt:confirm');
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') ipcRenderer.send('dlprompt:cancel');
            if (e.key === 'Enter') ipcRenderer.send('dlprompt:confirm');
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Bandcore</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; scrollbar-width: none; -ms-overflow-style: none; }
        ::-webkit-scrollbar { width: 0; height: 0; display: none; }
        :root {
            --bg: #181a1b; --titlebar: #121415; --input: #121415; --bar: #1b1e1f;
            --panel: #161819; --card: #202325; --hover-bg: #24282a;
            --line: #2a2e30; --line-2: #1e2224; --scroll: #3a3f42;
            --text: #e8e6e3; --text-2: #cfcac2; --muted: #9a968e; --sub: #848079;
            --accent: #1da0c3; --hover-text: #ffffff;
            --ease: cubic-bezier(.22,.61,.36,1);
        }
        html, body { height: 100%; }
        body {
            background: var(--bg); color: var(--text); overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Roboto, sans-serif;
            display: flex; flex-direction: column; user-select: none;
        }

        /* --- header zone -------------------------------------------------- */
        .top {
            display: flex; align-items: center; gap: 10px; padding: 22px 26px 4px; flex-shrink: 0;
        }
        .hello { font-size: 1.75rem; font-weight: 700; line-height: 1.08; letter-spacing: -.01em; }
        .hello small {
            display: block; font-size: 0.75rem; color: var(--sub); font-weight: 400;
            margin-top: 5px; letter-spacing: .04em;
        }
        .spacer { flex: 1; }
        /* ghost close: only exists when you look for it */
        .closebtn {
            width: 30px; height: 30px; border: none; border-radius: 50%; cursor: pointer;
            background: var(--hover-bg); color: var(--muted); font-size: 0.8125rem; line-height: 1;
            opacity: 0; transition: opacity .25s ease, background .15s ease, color .15s ease;
        }
        .top:hover .closebtn, .closebtn:focus-visible { opacity: 1; }
        .closebtn:hover { background: var(--accent); color: var(--hover-text); }

        .scroll { flex: 1; overflow-y: auto; padding: 10px 26px 30px; }

        /* --- sections: shared --------------------------------------------- */
        .rail { margin-top: 28px; animation: riseIn .55s var(--ease) both; }
        .rail:nth-child(2) { animation-delay: .07s; }
        .rail:nth-child(3) { animation-delay: .14s; }
        .rail:nth-child(4) { animation-delay: .21s; }
        @keyframes riseIn {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: none; }
        }
        .rail h2 {
            font-size: 0.9375rem; font-weight: 700; margin-bottom: 12px; letter-spacing: .01em;
            display: flex; align-items: baseline; gap: 8px;
        }
        .rail h2 .sub { font-size: 0.6875rem; color: var(--sub); font-weight: 400; }
        .state { padding: 30px 4px; color: var(--muted); font-size: 0.75rem; white-space: nowrap; }

        /* --- jump back in: shortcut tiles ---------------------------------- */
        .tiles .tilegrid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px;
        }
        .tile {
            position: relative; display: flex; align-items: center; gap: 12px; min-width: 0;
            border-radius: 10px; padding: 8px 96px 8px 8px;
            cursor: pointer; overflow: hidden;
            transition: transform .18s var(--ease), box-shadow .18s ease;
        }
        /* the artwork itself, blurred, becomes the tile's backdrop */
        .tile .bgart {
            position: absolute; inset: -20px; width: calc(100% + 40px); height: calc(100% + 40px);
            object-fit: cover; display: block; pointer-events: none;
            filter: blur(16px) saturate(1.2) brightness(.3);
            z-index: 0;
        }
        .tile:hover { box-shadow: 0 6px 18px rgba(0,0,0,.35); }
        /* subtle grounding gradient at the tile's bottom */
        .tile::after {
            content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 58%;
            background: linear-gradient(to top, rgba(8,9,10,.5), rgba(8,9,10,0));
            pointer-events: none; z-index: 0;
        }
        .tile .art {
            width: 48px; height: 48px; border-radius: 7px; object-fit: cover; display: block;
            background: var(--line); flex-shrink: 0; box-shadow: 0 3px 10px rgba(0,0,0,.4);
            position: relative; z-index: 1;
        }
        .tile .tt { min-width: 0; position: relative; z-index: 1; }
        .tile .t { font-size: 0.8125rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tile .a { font-size: 0.6875rem; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tile .play, .tile .enq {
            position: absolute; top: 50%; transform: translateY(-50%) translateX(6px);
            width: 30px; height: 30px; border: none; border-radius: 50%;
            background: var(--accent); color: #fff; cursor: pointer;
            font-size: 0.75rem; line-height: 1; display: inline-flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity .18s ease, transform .18s var(--ease), filter .12s ease;
        }
        .tile .play { right: 52px; }
        .tile .enq { right: 14px; background: rgba(10,11,12,.9); color: var(--text-2); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
        .tile:hover .play, .tile:hover .enq { opacity: 1; transform: translateY(-50%) translateX(0); }
        .tile .play:hover, .tile .enq:hover { filter: brightness(1.15); }

        /* --- shelves (wishlist / feed / discover) -------------------------- */
        .rowwrap { position: relative; }
        .row { display: flex; gap: 16px; overflow-x: auto; padding: 8px 2px 10px; }
                /* smart edge fades: hint at more content, only when there is any */
        .fade {
            position: absolute; top: -8px; bottom: -10px; width: 60px; z-index: 2;
            pointer-events: none; opacity: 0; transition: opacity .28s ease;
        }
        .fade.l { left: -2px; background: linear-gradient(to right, #000 14%, rgba(0,0,0,0)); }
        .fade.r { right: -2px; background: linear-gradient(to left, #000 14%, rgba(0,0,0,0)); }
        .fade.on { opacity: 1; }
        /* floating edge chevrons - appear only while the shelf is hovered */
        .edge {
            position: absolute; top: 38%; z-index: 3;
            width: 34px; height: 34px; border: none; border-radius: 50%;
            background: rgba(10,11,12,.9); color: var(--text-2); cursor: pointer;
            -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
            font-size: 1.05rem; line-height: 1; display: inline-flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 16px rgba(0,0,0,.45);
            opacity: 0; pointer-events: none; transform: translateY(-50%) scale(.9);
            transition: opacity .22s ease, transform .22s var(--ease), background .15s ease;
        }
        .edge.l { left: -8px; }
        .edge.r { right: -8px; }
        .rail:hover .edge:not(.dim) { opacity: 1; pointer-events: auto; transform: translateY(-50%) scale(1); }
        .edge:hover { background: var(--accent); }
        .edge.dim { opacity: 0 !important; pointer-events: none !important; }

        /* --- standard shelf card (wishlist) -------------------------------- */
        .shelf .card, .feed .card, .discover .card {
            flex-shrink: 0; cursor: pointer;
            animation: riseIn .45s var(--ease) both;
        }
        .shelf .card { width: 150px; }
        .artwrap {
            position: relative; border-radius: 10px; overflow: visible;
            transition: transform .22s var(--ease), filter .22s ease;
        }
        .art {
            width: 150px; height: 150px; border-radius: 10px; background: var(--line);
            object-fit: cover; display: block;
            transition: transform .35s var(--ease);
        }
        .artwrap::after {
            /* soft depth under every cover, revealed on lift */
            content: ''; position: absolute; inset: 0; border-radius: 10px;
            box-shadow: 0 14px 30px rgba(0,0,0,.5); opacity: 0;
            transition: opacity .22s ease; pointer-events: none;
        }
        .card:hover .artwrap { transform: translateY(-4px); }
        .card:hover .artwrap::after { opacity: 1; }
        .card:hover .art { transform: scale(1.04); }
        .play, .enq {
            position: absolute; width: 32px; height: 32px; border: none; border-radius: 50%;
            background: var(--accent); color: #fff; line-height: 1; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            opacity: 0; transform: translateY(8px);
            transition: opacity .2s ease, transform .2s var(--ease), filter .12s ease;
        }
                .play { right: 8px; bottom: 8px; font-size: 0.8125rem; }
        .enq {
            right: 8px; top: 8px; font-size: 1.0625rem; transform: translateY(-8px);
            background: rgba(10,11,12,.9); color: var(--text-2);
            -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
        }
        .card:hover .play { opacity: 1; transform: translateY(0); }
        .card:hover .enq { opacity: 1; transform: translateY(0); }
        .play:hover, .enq:hover { filter: brightness(1.15); }
        .meta { padding-right: 4px; }
        .meta .t { font-size: 0.78125rem; font-weight: 600; margin-top: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .meta .a { font-size: 0.6875rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
        .meta .w { font-size: 0.625rem; color: var(--sub); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* --- feed variant: artist-forward + time accent --------------------- */
        .feed .card { width: 150px; }
        .feed .meta .who { font-size: 0.8125rem; font-weight: 700; margin-top: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .feed .meta .who .when { font-size: 0.5625rem; font-weight: 600; color: var(--accent); letter-spacing: .05em; text-transform: uppercase; margin-left: 6px; }
        .feed .meta .what { font-size: 0.6875rem; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .feed .meta .via { font-size: 0.625rem; color: var(--sub); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* --- discover variant: editorial feature cards ---------------------- */
        .discover .card { width: 180px; }
        /* the whole cover (artwork + gradient + label) scales as one on hover */
        .discover .artwrap { overflow: hidden; border-radius: 10px; }
        .discover .card:hover .artwrap { transform: translateY(-4px) scale(1.02); }
        .discover .card:hover .art { transform: none; }
        .discover .art { width: 180px; height: 180px; }
        .discover .artwrap::before {
            content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 62%;
            background: linear-gradient(to top, rgba(10,11,12,.92) 20%, rgba(10,11,12,0));
            border-radius: 0 0 10px 10px; pointer-events: none; z-index: 1;
            opacity: .95; transition: opacity .22s ease;
        }
        .discover .card:hover .artwrap::before { opacity: 1; }
        .discover .ovl {
            position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 12px;
        }
        .discover .ovl .t {
            font-size: 0.84375rem; font-weight: 700; color: #fff; line-height: 1.25;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .discover .ovl .a {
            font-size: 0.65625rem; color: rgba(255,255,255,.72); margin-top: 3px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .discover .ovl .a b { color: rgba(255,255,255,.92); font-weight: 600; }
        .discover .play, .discover .enq { z-index: 3; }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="top">
        <div class="hello" id="hello"></div>
        <div class="spacer"></div>
        <button class="closebtn" id="close" title="Close home">✕</button>
    </div>
    <div class="scroll" id="scroll">
        <section class="rail tiles" id="rail-recent">
            <h2>Jump back in <span class="sub" id="recent-sub"></span></h2>
            <div class="tilegrid" id="recent"><div class="state">…</div></div>
        </section>
        <section class="rail shelf" id="rail-wish">
            <h2>Wishlist <span class="sub" id="wish-sub"></span></h2>
            <div class="rowwrap">
                <div class="fade l"></div><div class="fade r"></div>
                <button class="edge l" id="wish-prev" title="Scroll left">‹</button>
                <div class="row" id="wish"><div class="state">…</div></div>
                <button class="edge r" id="wish-next" title="Scroll right">›</button>
            </div>
        </section>
        <section class="rail feed" id="rail-feed">
            <h2>Latest from your feed <span class="sub" id="feed-sub"></span></h2>
            <div class="rowwrap">
                <div class="fade l"></div><div class="fade r"></div>
                <button class="edge l" id="feed-prev" title="Scroll left">‹</button>
                <div class="row" id="feed"><div class="state">…</div></div>
                <button class="edge r" id="feed-next" title="Scroll right">›</button>
            </div>
        </section>
        <section class="rail discover" id="rail-discover">
            <h2>Discover <span class="sub" id="discover-sub"></span></h2>
            <div class="rowwrap">
                <div class="fade l"></div><div class="fade r"></div>
                <button class="edge l" id="discover-prev" title="Scroll left">‹</button>
                <div class="row" id="discover"><div class="state">…</div></div>
                <button class="edge r" id="discover-next" title="Scroll right">›</button>
            </div>
        </section>
    </div>

    <script>require('./home.js');</script>
</body>
</html>

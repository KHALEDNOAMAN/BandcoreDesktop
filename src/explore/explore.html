<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Bandcore</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; scrollbar-width: none; -ms-overflow-style: none; }
        ::-webkit-scrollbar { width: 0; height: 0; display: none; }
        :root {
            --bg: #181a1b; --panel: #161819; --card: #202325; --hover-bg: #24282a;
            --line: #2a2e30; --text: #e8e6e3; --muted: #9a968e; --sub: #848079;
            --accent: #1da0c3; --hover-text: #ffffff;
            --ease: cubic-bezier(.22,.61,.36,1);
        }
        html, body { height: 100%; }
        body {
            background: var(--bg); color: var(--text); overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Roboto, sans-serif;
            display: flex; flex-direction: column; user-select: none;
        }
        :focus, :focus-visible { outline: none; }
        .top {
            display: flex; align-items: center; gap: 12px; padding: 20px 26px 10px; flex-shrink: 0;
        }
        .back {
            width: 32px; height: 32px; border: none; border-radius: 50%; cursor: pointer;
            background: rgba(10,11,12,.9); color: var(--text); font-size: 0.9375rem; line-height: 1;
            -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
        }
        .back:hover { background: var(--accent); color: #fff; }
        .xtitle { font-size: 1.25rem; font-weight: 700; letter-spacing: -.01em; }
        .xsub { font-size: 0.6875rem; color: var(--sub); margin-left: auto; }
        .scroll { flex: 1; overflow-y: auto; padding: 6px 26px 30px; }
        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 18px 16px;
        }
        .card { width: auto; cursor: pointer; animation: riseIn .4s var(--ease) both; }
        @keyframes riseIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: none; }
        }
        .artwrap { position: relative; border-radius: 10px; transition: transform .22s var(--ease); }
        .artwrap::after {
            content: ''; position: absolute; inset: 0; border-radius: 10px;
            box-shadow: 0 14px 30px rgba(0,0,0,.5); opacity: 0;
            transition: opacity .22s ease; pointer-events: none;
        }
        .card:hover .artwrap { transform: translateY(-4px) scale(1.02); }
        .card:hover .artwrap::after { opacity: 1; }
        .art {
            width: 100%; aspect-ratio: 1 / 1; border-radius: 10px; background: var(--line);
            object-fit: cover; display: block; transition: transform .35s var(--ease);
        }
        .play, .enq {
            position: absolute; width: 32px; height: 32px; border: none; border-radius: 50%;
            line-height: 1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
            opacity: 0; transform: translateY(8px);
            transition: opacity .2s ease, transform .2s var(--ease), background .15s ease;
        }
        .play {
            right: 8px; bottom: 8px; font-size: 0.8125rem;
            background: rgba(10,11,12,.9); color: #fff;
            -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
        }
        .enq {
            right: 8px; top: 8px; font-size: 1.0625rem; transform: translateY(-8px);
            background: rgba(10,11,12,.9); color: var(--text-2);
            -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
        }
        .card:hover .play { opacity: 1; transform: translateY(0); }
        .card:hover .enq { opacity: 1; transform: translateY(0); }
        .play:hover { background: rgba(28,30,32,.95); }
        .meta .t { font-size: 0.78125rem; font-weight: 600; margin-top: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .meta .a { font-size: 0.6875rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
        .meta .w { font-size: 0.625rem; color: var(--sub); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .state { padding: 40px 4px; color: var(--muted); font-size: 0.78125rem; }
        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="top">
        <button class="back" id="back" title="Back">‹</button>
        <div class="xtitle" id="xtitle"></div>
        <div class="xsub" id="xsub"></div>
    </div>
    <div class="scroll" id="scroll">
        <div class="grid" id="grid"><div class="state">loading…</div></div>
    </div>

    <script>require('./explore.js');</script>
</body>
</html>
